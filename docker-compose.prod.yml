# 本番用(Lightsail): 開発と同じ役割分担を全てコンテナで再現する
# 前提: docs/prod-prepare.md でサーバー構築と証明書取得が完了していること
# イメージはローカルでビルドし、docker save → scp → docker load でサーバーへ転送する(サーバーではビルドしない)
#   ローカルでのビルド: docker compose -f docker-compose.prod.yml build
services:
  web:
    image: my-training-task-web:latest
    build:
      context: .            # frontend/ を参照するためコンテキストはリポジトリルート
      dockerfile: web/Dockerfile
    container_name: training-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}          # アプリのURL(どの課題リポでも同じ。公開するリポを入れ替えて使う)
      TZ: Asia/Tokyo
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    image: my-training-task-backend:latest
    build: ./backend
    container_name: training-backend
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: training-db
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
